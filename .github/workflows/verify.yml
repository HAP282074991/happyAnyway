name: Project verification

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Project verification
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: happyAnyway-wechat/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: happyAnyway-api/pom.xml
      - name: Install locked WeChat dependencies
        working-directory: happyAnyway-wechat
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify tasks, documents and both projects
        if: ${{ !cancelled() }}
        run: ./scripts/verify.ps1 -Scope all -CI
      - name: Preserve verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .reports/verify/
            happyAnyway-api/target/surefire-reports/
